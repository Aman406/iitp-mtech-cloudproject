# Module A - Workload Forecasting: default experiment
# One simulated day of synthetic arrivals, aggregated into 5-minute intervals,
# evaluated walk-forward with several moving-average forecasters.

experiment.name=forecast-default
# Each seed generates an independent workload; results are reported per seed and as mean +/- std.
experiment.seeds=42,43,44,45,46
output.dir=results/forecasting

# ---- workload (shared framework keys) ----
workload.durationSeconds=86400
# mean arrival rate before modulation (tasks/s)
workload.baseRate=4.0
# daily cycle: rate swings between 40% and 160% of base
workload.diurnalAmplitude=0.6
workload.diurnalPeriodSeconds=86400
# start the day at the trough (-pi/2) so the series shows a full ramp-up and ramp-down
workload.diurnalPhase=-1.5708
workload.trendPerHour=0.0
# random flash crowds: about one per hour, doubling the rate for 10 minutes
workload.burstsPerHour=1.0
workload.burstMultiplier=2.0
workload.burstDurationSeconds=600
workload.service.type=LOGNORMAL
workload.service.meanSeconds=2.0
workload.service.cv=0.5

# ---- forecasting ----
forecast.intervalSeconds=300
# NAIVE (last value), SMA:<window>, WMA:<window>, EMA:<alpha>
forecast.models=NAIVE,SMA:3,SMA:6,SMA:12,WMA:3,WMA:6,WMA:12,EMA:0.3,EMA:0.6
# steps ahead (1 = next 5-minute interval, 3 = 15 minutes ahead)
forecast.horizons=1,3
# leave empty for automatic warm-up (largest window + largest horizon - 1)
forecast.warmupIntervals=
output.series=true
