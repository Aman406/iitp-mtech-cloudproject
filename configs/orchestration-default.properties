# Module B - Cost-Aware Predictive Resource Orchestration: default experiment
# Two hours of synthetic load with a compressed 1-hour cycle and random bursts,
# per-minute billing, 60 s worker cold start.

experiment.name=orchestration-default
experiment.seeds=42,43,44,45,46
output.dir=results/orchestration

# FIXED:<n> = static pool of n workers; FIXED uses policy.fixed.workers
policies=FIXED:12,FIXED:32,REACTIVE,PREDICTIVE,PREDICTIVE_COST_AWARE

# ---- workload ----
workload.durationSeconds=7200
workload.baseRate=4.0
workload.diurnalAmplitude=0.6
workload.diurnalPeriodSeconds=3600
workload.diurnalPhase=0.0
workload.trendPerHour=0.0
workload.burstsPerHour=2.0
workload.burstMultiplier=2.5
workload.burstDurationSeconds=300
workload.service.type=LOGNORMAL
workload.service.meanSeconds=2.0
workload.service.cv=0.5

# ---- worker pool and control loop ----
control.intervalSeconds=60
pool.initialWorkers=8
pool.minWorkers=1
pool.maxWorkers=40
pool.provisioningDelaySeconds=60
simulation.maxDrainSeconds=3600

# ---- simulated cost (abstract currency units, not a real price list) ----
cost.pricePerWorkerHour=0.10
cost.billingGranularitySeconds=60
cost.minimumBilledSeconds=60

# a task "violates the SLA" if its end-to-end latency exceeds this
sla.latencySeconds=10

# ---- policy parameters ----
policy.fixed.workers=12

policy.reactive.upperUtilization=0.80
policy.reactive.lowerUtilization=0.40
policy.reactive.queuePerWorkerThreshold=2.0
policy.reactive.scaleOutStep=4
policy.reactive.scaleInStep=2
policy.reactive.scaleOutCooldownIntervals=1
policy.reactive.scaleInCooldownIntervals=3

policy.predictive.forecaster=SMA:3
policy.predictive.targetUtilization=0.75
policy.predictive.safetyMargin=0.10
policy.predictive.backlogDrainIntervals=1.0
policy.predictive.scaleInCooldownIntervals=2
# default = ceil(provisioningDelay / controlInterval); moving averages give a flat forecast,
# so this matters only for forecasters with a trend component
policy.predictive.lookaheadIntervals=
# fallback before any task has completed; afterwards the observed mean is used
policy.predictive.initialMeanServiceSeconds=2.0

# write one CSV row per task (large files)
output.taskRecords=false
